name: Build Desktop Releases

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
            artifact: KaroSpaceBuilder-macos
          - os: windows-latest
            target: windows
            artifact: KaroSpaceBuilder-windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build app bundle
        run: python scripts/build_desktop.py

      - name: Package macOS app
        if: matrix.target == 'macos'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/KaroSpaceBuilder.app release/KaroSpaceBuilder-macos.zip

      - name: Package Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/KaroSpaceBuilder -DestinationPath release/KaroSpaceBuilder-windows.zip -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.zip

      - name: Attach binaries to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
