name: Build Desktop Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: latest v* tag)"
        required: false
        type: string
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Checkout (for tag discovery)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag/ref
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_tag=""
          release_ref=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "${INPUT_TAG:-}" ]]; then
              release_tag="$INPUT_TAG"
            else
              git fetch --force --tags
              release_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            fi
            if [[ -z "$release_tag" ]]; then
              echo "No v* tags found. Provide workflow input 'tag'." >&2
              exit 1
            fi
            release_ref="refs/tags/$release_tag"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$RELEASE_TAG"
            release_ref="refs/tags/$release_tag"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            release_ref="$GITHUB_REF_VALUE"
            release_tag="${GITHUB_REF_VALUE#refs/tags/}"
          else
            echo "Unsupported trigger for release workflow: $EVENT_NAME" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "Building tag: $release_tag"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            artifact: KaroSpaceBuilder-macos-arm64
            zip_name: KaroSpaceBuilder-macos-arm64.zip
            python_version: "3.12"
          - os: windows-latest
            target: windows
            artifact: KaroSpaceBuilder-windows
            zip_name: KaroSpaceBuilder-windows.zip
            python_version: "3.12"
          # Use an active hosted runner label to avoid stalled queued jobs.
          - os: ubuntu-latest
            target: linux
            artifact: KaroSpaceBuilder-linux
            zip_name: KaroSpaceBuilder-linux.zip
            python_version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build app bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python scripts/build_desktop.py

      - name: Package macOS app
        if: startsWith(matrix.target, 'macos')
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/KaroSpaceBuilder.app release/${{ matrix.zip_name }}

      - name: Package Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/KaroSpaceBuilder -DestinationPath release/${{ matrix.zip_name }} -Force

      - name: Package Linux app
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/${{ matrix.zip_name }}" KaroSpaceBuilder

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.zip

  publish:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: KaroSpaceBuilder-*
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          ls -la release-artifacts || true

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: release-artifacts/*.zip
          fail_on_unmatched_files: true
