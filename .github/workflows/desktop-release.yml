name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            artifact: KaroSpaceBuilder-macos-arm64
            zip_name: KaroSpaceBuilder-macos-arm64.zip
            python_version: "3.12"
          - os: macos-15-intel
            target: macos-intel
            artifact: KaroSpaceBuilder-macos-intel
            zip_name: KaroSpaceBuilder-macos-intel.zip
            python_version: "3.10"
          - os: windows-latest
            target: windows
            artifact: KaroSpaceBuilder-windows
            zip_name: KaroSpaceBuilder-windows.zip
            python_version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build app bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python scripts/build_desktop.py

      - name: Package macOS app
        if: startsWith(matrix.target, 'macos')
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/KaroSpaceBuilder.app release/${{ matrix.zip_name }}

      - name: Package Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/KaroSpaceBuilder -DestinationPath release/${{ matrix.zip_name }} -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.zip

      - name: Attach binaries to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
