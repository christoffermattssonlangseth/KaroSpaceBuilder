name: Build Desktop Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: latest v* tag)"
        required: false
        type: string
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Checkout (for tag discovery)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag/ref
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_tag=""
          release_ref=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "${INPUT_TAG:-}" ]]; then
              release_tag="$INPUT_TAG"
            else
              git fetch --force --tags
              release_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            fi
            if [[ -z "$release_tag" ]]; then
              echo "No v* tags found. Provide workflow input 'tag'." >&2
              exit 1
            fi
            release_ref="refs/tags/$release_tag"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$RELEASE_TAG"
            release_ref="refs/tags/$release_tag"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            release_ref="$GITHUB_REF_VALUE"
            release_tag="${GITHUB_REF_VALUE#refs/tags/}"
          else
            echo "Unsupported trigger for release workflow: $EVENT_NAME" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "Building tag: $release_tag"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            artifact: KaroSpaceBuilder-macos-arm64
            zip_name: KaroSpaceBuilder-macos-arm64.zip
            python_version: "3.12"
          - os: windows-latest
            target: windows
            artifact: KaroSpaceBuilder-windows
            zip_name: KaroSpaceBuilder-windows.zip
            python_version: "3.12"
          # Use an active hosted runner label to avoid stalled queued jobs.
          - os: ubuntu-latest
            target: linux
            artifact: KaroSpaceBuilder-linux
            zip_name: KaroSpaceBuilder-linux.zip
            python_version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build app bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: python scripts/build_desktop.py

      - name: Configure macOS signing
        if: startsWith(matrix.target, 'macos')
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          required=(
            MACOS_CERT_P12_BASE64
            MACOS_CERT_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          missing=()
          for var in "${required[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              missing+=("$var")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "Skipping macOS codesign/notarization. Missing secrets: ${missing[*]}"
            exit 0
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/macos_signing_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos_signing.keychain-db"

          echo "$MACOS_CERT_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains="$(security list-keychains -d user | sed 's/^[[:space:]]*//' | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing_keychains

          resolved_identity=""
          if [[ -n "${MACOS_CERT_NAME:-}" ]]; then
            if security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "\"$MACOS_CERT_NAME\"" >/dev/null; then
              resolved_identity="$MACOS_CERT_NAME"
            else
              echo "Provided MACOS_CERT_NAME not found in keychain; auto-detecting Developer ID Application identity."
            fi
          fi

          if [[ -z "$resolved_identity" ]]; then
            resolved_identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          fi

          if [[ -z "$resolved_identity" ]]; then
            echo "Unable to find a Developer ID Application identity in the imported keychain." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "MACOS_CODESIGN_IDENTITY=$resolved_identity" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

      - name: Codesign macOS app
        if: startsWith(matrix.target, 'macos') && env.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" dist/KaroSpaceBuilder.app
          codesign --verify --deep --strict --verbose=2 dist/KaroSpaceBuilder.app

      - name: Notarize and staple macOS app
        if: startsWith(matrix.target, 'macos') && env.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          NOTARY_ZIP="$RUNNER_TEMP/${{ matrix.zip_name }}"
          ditto -c -k --sequesterRsrc --keepParent dist/KaroSpaceBuilder.app "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/KaroSpaceBuilder.app
          xcrun stapler validate dist/KaroSpaceBuilder.app

      - name: Package macOS app
        if: startsWith(matrix.target, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "${MACOS_SIGNING_ENABLED:-false}" != "true" ]]; then
            echo "Packaging unsigned macOS app (signing secrets not configured)."
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/KaroSpaceBuilder.app release/${{ matrix.zip_name }}

      - name: Package Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/KaroSpaceBuilder -DestinationPath release/${{ matrix.zip_name }} -Force

      - name: Package Linux app
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/${{ matrix.zip_name }}" KaroSpaceBuilder

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*.zip

  publish:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: KaroSpaceBuilder-*
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          ls -la release-artifacts || true

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: release-artifacts/*.zip
          fail_on_unmatched_files: true
